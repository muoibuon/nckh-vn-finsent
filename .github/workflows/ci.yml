name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (light, không cài torch để nhanh)
        run: |
          python -m pip install --upgrade pip
          pip install black==24.8.0 ruff==0.6.7 pytest==8.3.3

      - name: Lint with ruff
        run: ruff check src/ tests/ --exit-zero

      - name: Format check with black
        run: black --check src/ tests/ --line-length=100 || true

      - name: Run tests (chỉ test không cần GPU / model weights)
        run: pytest tests/ -v -m "not gpu and not slow" || true
